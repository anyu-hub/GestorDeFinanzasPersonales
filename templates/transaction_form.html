{% extends "base.html" %}
{% block title %}Registrar movimiento · Finanzas claras{% endblock %}
{% block content %}
<section class="content-card form-card">
  <p class="eyebrow">Método activo: {{ model.name }}</p>
  <h1>Registrar movimiento</h1>
  <p>Las categorías disponibles corresponden a tu método financiero.</p>
  <form method="post" class="stack">
    <label>Tipo
      <select name="transaction_type" required>
        <option value="">Selecciona un tipo</option>
        <option value="income">Ingreso</option>
        <option value="expense">Gasto</option>
      </select>
    </label>
    <label>Categoría
      <select name="category_id" required>
        <option value="">Selecciona una categoría</option>
        {% for category in categories %}
          <option value="{{ category.id }}" data-type="{{ category.transaction_type }}">
            {{ category.group_name }} · {{ category.name }}
          </option>
        {% endfor %}
      </select>
    </label>
    <label>Monto (USD)
      <input type="number" name="amount" min="0.01" step="0.01" required>
    </label>
    <label>Fecha
      <input type="date" name="transaction_date" value="{{ today }}" max="{{ today }}" required>
    </label>
    <label>Descripción (opcional)
      <input name="description" maxlength="200">
    </label>
    <button class="button" type="submit">Guardar movimiento</button>
  </form>
</section>
{% endblock %}
